<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>LED Control Room</title>
<meta name="description" content="Visual Rhyme LED Control Room — redesign prototype with Light-up Preview. Offline, read-only.">
<style>
/* =====================================================================
   Tokens — dark first, light via prefers-color-scheme or [data-theme]
   ===================================================================== */
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", ui-monospace, Menlo, monospace;
  --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-xl: 18px;
  --rail-w: 236px;

  color-scheme: dark;
  --bg: #09080d; --rail: #0c0b11; --surface: #121019; --surface-2: #17141f; --surface-3: #201c29; --inset: #0d0b12;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.115); --line-3: rgba(255,255,255,.2);
  --text: #efebf5; --text-2: #aca5b9; --text-3: #8f889d;
  --brand: #9D20D6; --brand-2: #b54ae8; --brand-ink: #cf92f6; --brand-soft: rgba(157,32,214,.16); --brand-line: rgba(181,74,232,.5);
  --on-brand: #ffffff;
  --ok: #45d690; --ok-soft: rgba(69,214,144,.11);
  --info: #6cb1ff; --info-soft: rgba(108,177,255,.11);
  --warn: #f4b94c; --warn-soft: rgba(244,185,76,.12);
  --bad: #ff6b79; --bad-soft: rgba(255,107,121,.12);
  --focus: #e2b8ff;
  --shadow: 0 1px 0 rgba(255,255,255,.035) inset, 0 12px 32px -16px rgba(0,0,0,.7);
  --dot: rgba(255,255,255,.05);
  --scrim: rgba(9,8,13,.72);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f5f3f8; --rail: #fbfafd; --surface: #ffffff; --surface-2: #f5f2f9; --surface-3: #ebe6f2; --inset: #f1eef5;
    --line: rgba(28,16,52,.08); --line-2: rgba(28,16,52,.13); --line-3: rgba(28,16,52,.24);
    --text: #17131f; --text-2: #4d4658; --text-3: #645d70;
    --brand-ink: #7a12ae; --brand-soft: rgba(157,32,214,.085); --brand-line: rgba(157,32,214,.38);
    --ok: #0c7646; --ok-soft: rgba(12,118,70,.09);
    --info: #1a5cbc; --info-soft: rgba(26,92,188,.085);
    --warn: #875400; --warn-soft: rgba(214,146,20,.14);
    --bad: #bb1d31; --bad-soft: rgba(187,29,49,.08);
    --focus: #7a12ae;
    --shadow: 0 1px 2px rgba(28,16,52,.05), 0 10px 28px -16px rgba(28,16,52,.22);
    --dot: rgba(28,16,52,.07);
    --scrim: rgba(245,243,248,.8);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f3f8; --rail: #fbfafd; --surface: #ffffff; --surface-2: #f5f2f9; --surface-3: #ebe6f2; --inset: #f1eef5;
  --line: rgba(28,16,52,.08); --line-2: rgba(28,16,52,.13); --line-3: rgba(28,16,52,.24);
  --text: #17131f; --text-2: #4d4658; --text-3: #645d70;
  --brand-ink: #7a12ae; --brand-soft: rgba(157,32,214,.085); --brand-line: rgba(157,32,214,.38);
  --ok: #0c7646; --ok-soft: rgba(12,118,70,.09);
  --info: #1a5cbc; --info-soft: rgba(26,92,188,.085);
  --warn: #875400; --warn-soft: rgba(214,146,20,.14);
  --bad: #bb1d31; --bad-soft: rgba(187,29,49,.08);
  --focus: #7a12ae;
  --shadow: 0 1px 2px rgba(28,16,52,.05), 0 10px 28px -16px rgba(28,16,52,.22);
  --dot: rgba(28,16,52,.07);
  --scrim: rgba(245,243,248,.8);
}

/* =====================================================================
   Base
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font); font-feature-settings: "tnum" 0;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.012em; }
p { margin: 0; }
a { color: var(--brand-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--brand-soft); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--surface); padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line-2); }
.skip:focus { top: 12px; }

/* =====================================================================
   Shell — rail on desktop, top bar + bottom tabs on phone
   ===================================================================== */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px;
  padding: 20px 14px 16px; background: var(--rail); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px; color: var(--text); }
.brand:hover { text-decoration: none; }
.mark { width: 34px; height: 34px; flex: none; border-radius: 9px; background: #0a0810; box-shadow: 0 0 0 1px rgba(181,74,232,.35), 0 6px 18px -6px rgba(157,32,214,.7); display: grid; place-items: center; }
.mark svg { width: 24px; height: 24px; }
.brand b { display: block; font: 600 14.5px/1.2 var(--font-display); letter-spacing: -.01em; }
.brand span { display: block; font-size: 12px; color: var(--text-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 0 10px 6px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px;
  color: var(--text-2); font-weight: 500; transition: background .15s, color .15s;
}
.nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--surface-3); color: var(--text); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-2); box-shadow: 0 0 12px var(--brand); }
.nav a[aria-current="page"] svg { color: var(--brand-ink); }
.nav .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nav .nav-t { flex: 1; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.ro {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border-radius: var(--r); background: var(--surface);
  border: 1px solid var(--line); font-size: 12px; color: var(--text-2); line-height: 1.4;
}
.ro svg { color: var(--ok); margin-top: 1px; width: 16px; height: 16px; }
.ro b { color: var(--text); font-weight: 600; display: block; }
.rail-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; font-size: 12px; color: var(--text-3); }
.src-dot { display: inline-flex; align-items: center; gap: 6px; }
.src-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.src-dot.snap::before { background: var(--info); box-shadow: 0 0 8px var(--info); }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--text-2);
}
.icon-btn:hover { color: var(--text); border-color: var(--line-3); }
.icon-btn svg { width: 16px; height: 16px; }

.mhead { display: none; }
.main-col { min-width: 0; }
main { padding: 34px 40px 120px; max-width: 1320px; margin: 0 auto; outline: none; }
main.enter > * { animation: rise .32s cubic-bezier(.2,.7,.2,1) both; }
main.enter > *:nth-child(2) { animation-delay: .03s; } main.enter > *:nth-child(3) { animation-delay: .06s; } main.enter > *:nth-child(4) { animation-delay: .09s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* =====================================================================
   Page furniture
   ===================================================================== */
.page-head { position: relative; margin-bottom: 22px; }
.page-head::before {
  content: ""; position: absolute; inset: -34px -40px auto; height: 190px; z-index: -1; pointer-events: none;
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 14px 14px;
  -webkit-mask-image: radial-gradient(ellipse 70% 100% at 18% 0%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 70% 100% at 18% 0%, #000 20%, transparent 75%);
}
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink); margin-bottom: 8px; }
.eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-2); box-shadow: 0 0 10px var(--brand-2); }
.page-head h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
.lede { margin-top: 8px; color: var(--text-2); font-size: 15px; max-width: 64ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.label { font-size: 12px; font-weight: 500; color: var(--text-3); }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 12px; }
.section-title h2 { font-size: 18px; }
.section-title p { color: var(--text-3); font-size: 13px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font-weight: 500; font-size: 13.5px; white-space: nowrap;
  transition: border-color .15s, background .15s, transform .1s;
}
.btn:hover { border-color: var(--line-3); background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: transparent; color: var(--on-brand); box-shadow: 0 6px 18px -8px rgba(157,32,214,.8), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.primary:hover { background: #8c19c2; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.set { border-color: var(--brand-line); color: var(--brand-ink); background: var(--brand-soft); }

/* Status language */
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 8px; border-radius: 99px;
  font-size: 12px; font-weight: 600; white-space: nowrap; letter-spacing: .005em;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.info { color: var(--info); background: var(--info-soft); }
.pill.amber { color: var(--warn); background: var(--warn-soft); }
.pill.red { color: var(--bad); background: var(--bad-soft); }
.pill.neutral { color: var(--text-2); background: var(--surface-3); }
.pill.neutral::before { display: none; }
.brand-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.brand-chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; }
.brand-chip.NovaStar::before { background: #e8763a; }
.brand-chip.Colorlight::before { background: #3aa7e8; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); font: 500 12px/1 var(--mono); white-space: nowrap; }

/* =====================================================================
   Overview
   ===================================================================== */
.ov { display: grid; grid-template-columns: minmax(0, 2.1fr) repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.ov .card { padding: 16px 18px; }
.ov-stat b { display: block; font: 600 28px/1.1 var(--font-display); letter-spacing: -.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.ov-stat .meta { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.ov-health .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ov-health .big { font: 600 15px/1.2 var(--font-display); color: var(--warn); font-variant-numeric: tabular-nums; }
.stackbar { display: flex; gap: 3px; height: 10px; margin: 14px 0 12px; }
.stackbar span { border-radius: 3px; min-width: 3px; }
.stackbar .ok { background: var(--ok); } .stackbar .info { background: var(--info); } .stackbar .amber { background: var(--warn); } .stackbar .red { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--text-2); }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.legend li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

.callout {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 16px; margin-bottom: 18px; border-radius: var(--r-lg);
  border: 1px solid var(--brand-line); background: linear-gradient(90deg, var(--brand-soft), transparent 70%);
}
.callout .new { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--on-brand); background: var(--brand); padding: 3px 7px; border-radius: 5px; }
.callout p { flex: 1; color: var(--text-2); }
.callout p b { color: var(--text); font-weight: 600; }

/* =====================================================================
   Toolbar
   ===================================================================== */
.toolbar {
  position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 12px 0; margin: 0 0 4px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.search { position: relative; flex: 1 1 320px; display: flex; align-items: center; min-width: 0; }
.search svg { position: absolute; left: 12px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; height: 40px; padding: 0 44px 0 38px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-soft); }
.search kbd { position: absolute; right: 10px; font: 500 11px/1 var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 6px; background: var(--surface-2); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-weight: 500; font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: 0 0 0 1px var(--line-2) inset; }
.seg .n { color: var(--text-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 32px; height: 18px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-2); transition: transform .18s, background .15s; }
.switch input:checked + .track { background: var(--brand); border-color: transparent; }
.switch input:checked + .track::after { transform: translateX(14px); background: #fff; }
.switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
.results-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 2px 10px; font-size: 12.5px; color: var(--text-3); }

/* =====================================================================
   Tables
   ===================================================================== */
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data th {
  text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3);
  padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
}
.data td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.data tbody tr:last-child td { border-bottom: 0; }
.data tr.row { cursor: pointer; transition: background .12s; }
.data tr.row:hover { background: var(--surface-2); }
.data td.num, .data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.data .name a { color: var(--text); font-weight: 600; word-break: break-word; }
.data .name a:hover { color: var(--brand-ink); }
.data .name .sub { display: none; }
.data .dim { color: var(--text-3); }
.data .sites { color: var(--text-2); max-width: 260px; }
.bright { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.meter { width: 36px; height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--text-3); border-radius: 4px; }
.meter.low i { background: var(--warn); }
.more-row { display: flex; justify-content: center; padding: 14px; }

/* Empty + loading */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 56px 20px; }
.empty svg.art { width: 92px; height: 60px; margin-bottom: 6px; }
.empty h3 { font-size: 17px; }
.empty p { color: var(--text-2); max-width: 46ch; }
.empty .btn { margin-top: 6px; }
.skel { display: grid; gap: 0; }
.skel div { height: 46px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 14px; }
.skel span { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* =====================================================================
   Detail
   ===================================================================== */
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); margin-bottom: 18px; min-width: 0; }
.crumbs a { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
.crumbs a svg { width: 16px; height: 16px; }
.crumbs span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.d-title { min-width: 0; flex: 1 1 420px; }
.d-title h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.02em; word-break: break-word; }
.d-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 10px; color: var(--text-2); font-size: 13px; }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 16px 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }
.verdict::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.verdict .vi { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--c); background: var(--cs); }
.verdict h2 { font-size: 16px; }
.verdict .vsub { color: var(--text-2); margin-top: 2px; }
.findings { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.findings li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); }
.findings b { font-weight: 600; display: block; }
.findings p { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.keys { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; margin-top: 14px; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.keys div { background: var(--surface); padding: 13px 16px; min-width: 0; }
.keys b { display: block; font: 600 19px/1.2 var(--font-display); margin-top: 5px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.keys small { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.keys .warn b { color: var(--warn); }

.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.specs .card { padding: 6px 18px 8px; }
.specs h3 { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 12px 0 6px; letter-spacing: 0; }
.specs dl { margin: 0; }
.specs .kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.specs dt { color: var(--text-2); }
.specs dd { margin: 0; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.specs dd small { display: block; color: var(--text-3); font-weight: 400; font-size: 12px; }
.bad-txt { color: var(--bad); } .ok-txt { color: var(--ok); } .warn-txt { color: var(--warn); }

/* =====================================================================
   Light-up Preview
   ===================================================================== */
.lp { margin-top: 34px; border-radius: var(--r-xl); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.lp-top {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 22px 24px 18px;
  border-bottom: 1px solid var(--line); position: relative;
  background:
    radial-gradient(ellipse 60% 140% at 0% 0%, var(--brand-soft), transparent 70%),
    radial-gradient(var(--dot) 1.1px, transparent 1.2px) 0 0 / 12px 12px;
}
.lp-top h2 { font-size: 21px; display: flex; align-items: center; gap: 10px; }
.lp-top p { color: var(--text-2); margin-top: 4px; max-width: 70ch; }
.src-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); }
.src-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.src-tag.std::before { background: var(--info); }
.lp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.lp-grid > * { background: var(--surface); padding: 20px 24px 22px; min-width: 0; }
.lp-grid > .wide { grid-column: 1 / -1; }
.lp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.lp-h h3 { font-size: 15px; display: flex; align-items: center; gap: 9px; }
.lp-h h3 .step { font: 600 11px/1 var(--mono); color: var(--brand-ink); background: var(--brand-soft); padding: 4px 6px; border-radius: 5px; }
.lp-h .tag { font: 500 12px/1 var(--mono); color: var(--text-3); }
.caption { color: var(--text-2); font-size: 13.5px; }
.caption b { color: var(--text); font-weight: 600; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); background: var(--info-soft); color: var(--text-2); font-size: 13px; }
.note svg { color: var(--info); width: 16px; height: 16px; margin-top: 2px; }
.check-line { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--text-2); }
.check-line svg { width: 15px; height: 15px; margin-top: 2px; }
.check-line.ok svg { color: var(--ok); } .check-line.warn svg { color: var(--warn); }

.led-stage { background: #060509; border-radius: var(--r); border: 1px solid rgba(255,255,255,.08); padding: 14px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4), inset 0 20px 50px -30px rgba(157,32,214,.35); min-width: 0; }
.ds-note { margin-top: 10px; text-align: center; font: 500 11.5px/1.3 var(--mono); color: #9a93a8; }
.led-stage canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; image-rendering: auto; }

.scan-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
.scan-side { display: grid; gap: 14px; }
.readout { font: 500 12.5px/1.45 var(--mono); color: var(--text); background: var(--inset); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-height: 58px; }
.readout span { color: var(--text-3); }
.controls { display: grid; gap: 10px; }
.ctl-row { display: flex; gap: 8px; align-items: center; }
.speed { display: grid; gap: 6px; }
.speed label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); }
.speed output { font-family: var(--mono); color: var(--text); font-size: 12px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--brand-2) var(--p, 30%), var(--surface-3) var(--p, 30%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(157,32,214,.35), 0 2px 6px rgba(0,0,0,.4); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--surface-3); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--brand-2); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 4px rgba(157,32,214,.35); }
.speed .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }
.order-h { font-size: 12px; color: var(--text-3); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.order { display: flex; flex-wrap: wrap; gap: 3px; }
.order span { min-width: 22px; height: 20px; padding: 0 3px; display: grid; place-items: center; border-radius: 4px; font: 500 10.5px/1 var(--mono); color: var(--text-3); background: var(--surface-2); font-variant-numeric: tabular-nums; }
.order span.on { background: var(--brand); color: #fff; box-shadow: 0 0 10px rgba(181,74,232,.6); }
.rm-note { font-size: 12px; color: var(--text-3); }

.pic-ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.file-btn { position: relative; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.file-btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.pics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pic figure { margin: 0; }
.pic-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.pic-h b { font-size: 13.5px; font-weight: 600; }
.pic-h b.file { color: var(--brand-ink); }
.pic-h span { font: 500 11.5px/1.3 var(--mono); color: var(--text-3); }
.applied { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.applied .chip { height: auto; padding: 5px 8px; line-height: 1.25; white-space: normal; }
.disclaimer { margin-top: 14px; font-size: 12.5px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.disclaimer svg { width: 14px; height: 14px; }

.gamma svg, .cab svg { width: 100%; height: auto; display: block; }
.gamma .ax { stroke: var(--line-3); stroke-width: 1; }
.gamma .grid { stroke: var(--line); stroke-width: 1; }
.gamma text, .cab text { fill: var(--text-3); font: 500 10.5px var(--font); }
.gamma .t-axis { fill: var(--text-2); font-size: 11px; }
.gamma .ref { stroke: var(--text-3); stroke-width: 1.6; stroke-dasharray: 4 4; fill: none; }
.gamma .file { stroke: var(--brand-2); stroke-width: 2.4; fill: none; }
.gamma .file.rebuilt { stroke-dasharray: 1 4; }
.gamma .mk-file { fill: var(--brand-2); } .gamma .mk-ref { fill: var(--text-3); }
.gamma .lbl-file { fill: var(--brand-ink); font-weight: 600; } .gamma .lbl-ref { fill: var(--text-2); }
.g-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-2); margin: 10px 0 8px; }
.g-legend span { display: inline-flex; align-items: center; gap: 7px; }
.g-legend i { width: 18px; height: 0; border-top: 2.4px solid var(--brand-2); }
.g-legend i.r { border-top: 1.6px dashed var(--text-3); }
.cab .mod { fill: url(#ledpat); stroke: var(--line-3); stroke-width: 1; }
.cab .mod-bg { fill: #0b0910; }
.cab .px { fill: #e9e3f2; font: 600 11px var(--mono); }
.cab .badge { fill: var(--brand); }
.cab .badge-t { fill: #fff; font: 700 10px var(--font); }
.cab .flow { stroke: var(--brand-2); stroke-width: 2; fill: none; }
.cab .in-t { fill: var(--brand-ink); font-weight: 700; font-size: 10.5px; letter-spacing: .06em; }
.cab .dim-t { fill: var(--text-2); font-size: 11px; }
.cab-wrap { background: #060509; border-radius: var(--r); padding: 14px; border: 1px solid rgba(255,255,255,.08); }
.cab-wrap text.px { fill: #e9e3f2; }
.cab-wrap text.dim-t { fill: #b6aec4; }
.cab-wrap text.in-t { fill: #d9a3fa; }
.cab-wrap .mod { stroke: rgba(255,255,255,.22); }

/* =====================================================================
   Sites
   ===================================================================== */
.site-list { display: grid; gap: 8px; }
.site { border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.site summary {
  list-style: none; display: grid; grid-template-columns: 110px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 13px 16px; cursor: pointer; transition: background .12s;
}
.site summary::-webkit-details-marker { display: none; }
.site summary:hover { background: var(--surface-2); }
.site .nm { font-weight: 600; overflow-wrap: anywhere; }
.site .nm small { display: block; font-weight: 400; color: var(--text-3); font-size: 12.5px; margin-top: 1px; }
.site .cell-l { font-size: 12px; color: var(--text-3); display: block; }
.site .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.site .chev { color: var(--text-3); transition: transform .18s; }
.site[open] .chev { transform: rotate(90deg); }
.site-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.site-body .facts { display: flex; flex-wrap: wrap; gap: 8px 28px; padding-top: 12px; font-size: 13px; color: var(--text-2); }
.site-body .facts b { color: var(--text); font-weight: 500; }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.flags li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 9px 12px; border-radius: var(--r); background: var(--surface-2); font-size: 13px; }
.flags small { display: block; color: var(--text-3); font-family: var(--mono); font-size: 11.5px; margin-top: 2px; overflow-wrap: anywhere; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.files a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--text); max-width: 100%; overflow-wrap: anywhere; }
.files a:hover { border-color: var(--brand-line); text-decoration: none; color: var(--brand-ink); }
.files a.fw { color: var(--text-2); }
.allgood { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 500; }
.allgood svg { width: 16px; height: 16px; }

/* Compare tray + toast */
.tray {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--surface-3); border: 1px solid var(--line-2);
  box-shadow: 0 20px 40px -12px rgba(0,0,0,.55); max-width: calc(100vw - 32px); font-size: 13px;
}
.tray[hidden] { display: none; }
.tray .slot { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 220px; color: var(--text-2); }
.tray .slot b { font: 700 11px/1 var(--font); color: #fff; background: var(--brand); border-radius: 4px; padding: 3px 5px; }
.tray .slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast { position: fixed; right: 20px; top: 20px; z-index: 30; padding: 10px 14px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--line-2); box-shadow: 0 16px 30px -12px rgba(0,0,0,.5); font-size: 13px; opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }

/* Compare + inspect + firmware bits */
.cmp-slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.cmp-slot { padding: 14px 16px; }
.cmp-slot label { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 6px; font-weight: 600; letter-spacing: .04em; }
.cmp-slot input { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 12px; color: var(--text); }
.diff-a { color: var(--warn); } .diff-b { color: var(--info); }
.drop {
  display: grid; place-items: center; text-align: center; gap: 6px; padding: 54px 20px; border-radius: var(--r-xl);
  border: 1.5px dashed var(--line-3); background: radial-gradient(var(--dot) 1.2px, transparent 1.3px) 0 0 / 14px 14px, var(--surface);
  cursor: pointer; transition: border-color .15s, background-color .15s;
}
.drop:hover, .drop.over { border-color: var(--brand-2); }
.drop:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
.drop b { font: 600 18px/1.3 var(--font-display); }
.drop span { color: var(--text-2); }
.checks-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--text); font-size: 13px; margin-bottom: 16px; }
.banner svg { color: var(--warn); width: 16px; height: 16px; margin-top: 2px; }

/* =====================================================================
   Responsive
   ===================================================================== */
@media (max-width: 1180px) {
  .ov { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ov-health { grid-column: 1 / -1; }
  .keys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .scan-body { grid-template-columns: minmax(0, 1fr); }
  .data .hide-lg { display: none; }
}
@media (max-width: 980px) {
  :root { --rail-w: 72px; }
  .rail { padding: 18px 10px; align-items: center; }
  .brand > div, .nav-label, .nav .nav-t, .nav .count, .ro div, .rail-row .src-dot { display: none; }
  .nav a { justify-content: center; padding: 10px; }
  .nav a[aria-current="page"]::before { left: -10px; }
  .ro { padding: 10px; }
  .rail-row { justify-content: center; }
  main { padding: 28px 24px 120px; }
  .lp-grid { grid-template-columns: minmax(0, 1fr); }
  .specs { grid-template-columns: minmax(0, 1fr); }
  .site summary { grid-template-columns: 104px minmax(0, 1fr) auto auto; }
  .site .hide-md { display: none; }
}
@media (max-width: 720px) {
  .app { display: block; }
  .rail {
    position: fixed; z-index: 15; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--rail) 92%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .rail .brand, .rail-foot, .nav-label { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; gap: 0; }
  .nav a { flex-direction: column; gap: 3px; padding: 6px 4px; font-size: 11px; flex: 1; min-width: 0; }
  .nav .nav-t { display: block; flex: none; }
  .nav a[aria-current="page"] { background: transparent; color: var(--text); }
  .nav a[aria-current="page"]::before { left: 30%; right: 30%; top: -7px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  .mhead {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--rail); position: sticky; top: 0; z-index: 10;
  }
  .mhead .brand > div { display: block; }
  .mhead .brand b { font-size: 14px; }
  .mhead .mark { width: 30px; height: 30px; }
  .mhead .ro-m { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); padding: 5px 9px; border: 1px solid var(--line-2); border-radius: 99px; white-space: nowrap; }
  .mhead .ro-m svg { width: 13px; height: 13px; color: var(--ok); }
  main { padding: 22px 16px 110px; }
  .page-head h1 { font-size: 25px; }
  .page-head::before { inset: -22px -16px auto; }
  .lede { font-size: 14px; }
  .ov { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ov .card { padding: 12px 12px; }
  .ov-stat b { font-size: 22px; }
  .ov-stat .meta { font-size: 11.5px; }
  .callout { flex-wrap: wrap; align-items: flex-start; }
  .callout p { flex: 1 1 calc(100% - 70px); }
  .callout .btn { width: 100%; justify-content: center; }
  .toolbar { top: 57px; gap: 8px; }
  .search { flex-basis: 100%; }
  .search kbd { display: none; }
  .seg button { padding: 0 9px; font-size: 12.5px; }
  .seg .n { display: none; }
  /* table rows become cards */
  table.data thead { display: none; }
  table.data, .data tbody, .data tr { display: block; }
  .data tr.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .data tbody tr:last-child { border-bottom: 0; }
  .data td { display: none; padding: 0; border: 0; }
  .data td.name { display: block; grid-column: 1; }
  .data td.st { display: block; grid-column: 2; grid-row: 1; justify-self: end; }
  .data .name .sub { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 3px; font-weight: 400; }
  .data .name .sub.s2 { color: var(--text-3); }
  .table-wrap { overflow: hidden; }
  .d-title h1 { font-size: 21px; }
  .d-actions { width: 100%; }
  .d-actions .btn { flex: 1 1 auto; justify-content: center; }
  .keys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .keys b { font-size: 17px; }
  .lp-top, .lp-grid > * { padding-left: 16px; padding-right: 16px; }
  .led-stage { padding: 8px; }
  .pics { grid-template-columns: minmax(0, 1fr); }
  .site summary { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
  .site summary .st { grid-column: 1 / -1; order: -1; }
  .hide-sm, .site .hide-sm { display: none; }
  .cmp-slots { grid-template-columns: minmax(0, 1fr); }
  .tray { bottom: 76px; }
  .toast { left: 16px; right: 16px; top: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail" aria-label="Main">
    <a class="brand" href="#inspect" aria-label="LED Control Room home">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" id="mark-svg"></svg></span>
      <div><b>LED Control Room</b><span>Visual Rhyme</span></div>
    </a>
    <nav class="nav" aria-label="Sections">
      <div class="nav-label">Workspace</div>
      <a href="#inspect" data-view="inspect"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M4 12h16"/></svg><span class="nav-t">Inspect</span></a>
    </nav>
    <div class="rail-foot">
      <div class="ro" title="This tool never sends anything to a screen and never changes firmware.">
        <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <div><b>Read-only</b>Nothing is sent to screens.</div>
      </div>
      <div class="rail-row">
        <span class="src-dot" id="src-dot">Local</span>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme: system"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-col">
    <header class="mhead">
      <a class="brand" href="#inspect"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" class="mark-m"></svg></span><div><b>LED Control Room</b></div></a>
      <span class="ro-m"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Read-only</span>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="tray" id="tray" hidden role="region" aria-label="Compare selection"></div>

    </div>
    <div id="lib-out"></div>`;

  }));

const LABELS = {

  module_px: "Module pixels", pitch: "Pitch", scan: "Scan", card_load_px: "Card load", cabinet_px: "Cabinet",
  module_grid: "Module grid", data_groups: "Data groups", refresh_hz: "Refresh", gray_bits: "Gray depth", gray_level: "Gray level",
  gamma_header: "Gamma (setting)", gamma_table: "Gamma (measured)", brightness_pct: "Brightness", calibration: "Calibration",
  irregular_cabinet: "Irregular cabinet", rotation: "Rotation", dclk_mhz: "DCLK", gclk_mhz: "GCLK", shadow_removal: "Shadow removal",
  records: "Card instructions", checksum_ok: "Checksum",

  ["Picture", ["refresh_hz", "gray_bits", "gray_level", "gamma_header", "gamma_table", "brightness_pct", "calibration", "shadow_removal"]],
  ["File health", ["checksum_ok"]],
];
function fmtSpec(k, v, spec) {
  if (k === "pitch") return v ? `P${esc(v.value)}<small>${esc(v.source)}</small>` : "—";
  if (k === "checksum_ok") return v === true ? '<span class="ok-txt">OK</span>' : v === false ? '<span class="bad-txt">Failed</span>' : "—";
  if (v === true) return "On"; if (v === false) return "Off";
  if (v === null || v === undefined || v === "") return k === "refresh_hz" && spec.refresh_note ? `<small>${esc(spec.refresh_note)}</small>` : '<span class="dim" style="color:var(--text-3)">—</span>';
  if (k === "refresh_hz") return `${nf(v)} Hz`;
  if (k === "gray_bits") return `${esc(v)}-bit`;
  if (k === "brightness_pct") return `<span class="${v < 50 ? "warn-txt" : ""}">${esc(v)}%</span>`;
  if (k === "dclk_mhz" || k === "gclk_mhz") return `${esc(v)} MHz`;
  if (k === "gamma_table") return `≈${esc(Number(v).toFixed(1))}`;
  if (k === "gamma_header") return esc(Number(v).toFixed(1));
  if (k === "records") return `${esc(v)} steps`;
  if (k === "gray_level") return nf(v);
  if (k === "module_px" || k === "card_load_px" || k === "cabinet_px" || k === "module_grid") return esc(String(v).replace("x", " × "));
  return esc(v);
}

/* =====================================================================
   Light-up Preview — model
   Everything drawn below comes from the file's layout fields. See notes.
   ===================================================================== */
function buildModel(item, L) {
  const s = item.spec || {};
  const wh = parseWH(s.module_px) || [64, 32];
  if (!(wh[1] >= 1)) wh[1] = parseScan(s.scan) || 32;
  if (!(wh[0] >= 1)) wh[0] = 64;
  const scanS = Math.max(1, parseScan(s.scan) || wh[1]);
  const fromFile = !!(L && L.module_cols && L.scan && (L.source === "file" || L.source === undefined));
  const notes = [];
  let lay;
  if (fromFile) {
    // Coerce every numeric layout field so nothing non-numeric can reach the SVG/HTML strings.
    const n = (v) => (Number.isFinite(+v) ? +v : 0), arr = (a) => (Array.isArray(a) ? a.map(n) : []);
    lay = {
      module_cols: n(L.module_cols), module_rows: n(L.module_rows), scan: Math.max(1, n(L.scan)), data_groups_per_module: n(L.data_groups_per_module) || 1,
      rows_per_group: arr(L.rows_per_group), group_start_rows: arr(L.group_start_rows), data_direction: String(L.data_direction || "Horizontal"),
      modules_across: n(L.modules_across), modules_down: n(L.modules_down), cascade: L.cascade ? String(L.cascade) : null,
      scan_line_order: arr(L.scan_line_order), gamma_table_256: arr(L.gamma_table_256),
      gray_bits: L.gray_bits != null ? n(L.gray_bits) : null, brightness_0_255: L.brightness_0_255 != null ? n(L.brightness_0_255) : null,
    };
  }
  else {
    // Standard model: rows split into groups of `scan` rows, lit in order 0,1,2…
    const n = Math.max(1, Math.round(wh[1] / scanS));
    lay = {
      module_cols: wh[0], module_rows: wh[1], scan: scanS, data_groups_per_module: n,
      rows_per_group: Array.from({ length: n }, (_, k) => Math.min(scanS, wh[1] - k * scanS)),
      group_start_rows: Array.from({ length: n }, (_, k) => k * scanS),
      data_direction: "Horizontal", scan_line_order: Array.from({ length: scanS }, (_, k) => k),
    };
    notes.push(item.brand === "Colorlight"
      ? "Colorlight files report module size and scan only, so this uses the standard scan model (rows split into equal groups, lit top to bottom). The detailed layout, firing order and module cascade aren't available from Colorlight files."
      : "This prototype holds the full layout for three sample files only. Here the standard scan model is built from module size and scan; the live build reads this file's own layout.");
  }

  /* --- scan geometry. data_direction decides the axis: Horizontal → groups split ROWS, Vertical → groups split COLUMNS. */
  const vertical = /vert/i.test(lay.data_direction || "");
  const axisLen = vertical ? lay.module_cols : lay.module_rows;
  const otherLen = vertical ? lay.module_rows : lay.module_cols;
  const g = Math.max(1, lay.data_groups_per_module || 1);
  const starts = (lay.group_start_rows || []).slice(0, g);
  const lens = (lay.rows_per_group || []).slice(0, g);
  const scan = lay.scan;
  const order = Array.isArray(lay.scan_line_order) && lay.scan_line_order.length ? lay.scan_line_order.slice(0, scan) : Array.from({ length: scan }, (_, k) => k);
  const groups = starts.map((st, k) => ({ start: st, len: lens[k] ?? Math.round(axisLen / g) }));
  // At step k, line (start + order[k]) lights in every group. When a group is longer than the scan
  // (e.g. 32 rows at 1/16), the same scan line also drives start + order[k] + scan, + 2·scan…
  const steps = order.map((o) => {
    const lines = [];
    groups.forEach((gr) => { for (let j = 0; o + j * scan < gr.len; j++) { const ln = gr.start + o + j * scan; if (ln < axisLen) lines.push(ln); } });
    return lines;
  });
  const sorted = [...groups].sort((a, b) => a.start - b.start);
  let contiguous = sorted.length && sorted[0].start === 0; let end = 0;
  sorted.forEach((gr) => { if (gr.start !== end) contiguous = false; end = gr.start + gr.len; });
  const covered = contiguous && end === axisLen;
  const perGroup = Math.max(...groups.map((gr) => Math.ceil(gr.len / scan)));

  /* --- cabinet grid */
  let across = null, down = null, cascade = null;
  if (fromFile && lay.modules_across) { across = lay.modules_across; down = lay.modules_down; cascade = lay.cascade || null; }
  else if (s.module_grid) { const g2 = parseWH(s.module_grid); if (g2) [across, down] = g2; }
  else if (s.cabinet_px) { const c = parseWH(s.cabinet_px); if (c) { across = Math.round(c[0] / wh[0]); down = Math.round(c[1] / wh[1]); } }
  const loadPx = parseWH(s.card_load_px || s.cabinet_px) || (across ? [across * wh[0], down * wh[1]] : null);

  /* --- picture: gamma curve, brightness, gray depth */
  let table = null, gammaSrc, gammaLabel;
  if (fromFile && Array.isArray(lay.gamma_table_256) && lay.gamma_table_256.length > 1) {
    table = lay.gamma_table_256; gammaSrc = "file";
    gammaLabel = `Stored table · ${nf(table.length)} entries${s.gamma_table ? ` · measures ≈${Number(s.gamma_table).toFixed(1)}` : ""}`;
  } else if (s.gamma_table || s.gamma_header) {
    const gv = Number(s.gamma_table || s.gamma_header);
    table = Array.from({ length: 256 }, (_, k) => Math.pow(k / 255, gv)); gammaSrc = "rebuilt";
    gammaLabel = `Rebuilt from measured gamma ≈${gv.toFixed(1)}`;
  } else {
    table = Array.from({ length: 256 }, (_, k) => Math.pow(k / 255, 2.2)); gammaSrc = "assumed";
    gammaLabel = "Not in this file's summary · 2.2 assumed";
  }
  let bright, brightLabel;
  if (fromFile && lay.brightness_0_255 != null) { bright = lay.brightness_0_255 / 255; brightLabel = `${lay.brightness_0_255}/255 = ${Math.round(bright * 100)}%`; }
  else if (s.brightness_pct != null) { bright = s.brightness_pct / 100; brightLabel = `${s.brightness_pct}%`; }
  else { bright = 1; brightLabel = "not in file · 100% assumed"; }
  let bits = (fromFile && lay.gray_bits) || s.gray_bits || null, bitsLabel;
  if (bits) bitsLabel = `${bits}-bit`;
  else if (s.gray_level >= 256) { bits = Math.round(Math.log2(s.gray_level)); bitsLabel = `${bits}-bit (gray level ${nf(s.gray_level)})`; }
  else { bits = 16; bitsLabel = s.gray_level ? `unclear (file says ${s.gray_level}) · 16-bit assumed` : "not in file · 16-bit assumed"; }

  return {
    item, fromFile, notes, lay, vertical, axisLen, otherLen, groups, scan, order, steps, covered, perGroup,

    this.dots(bx, M.axisLen, "#1d1a26", false);
    // group brackets in the gutter
    bx.strokeStyle = "rgba(200,160,240,.55)"; bx.fillStyle = "rgba(220,200,240,.8)"; bx.lineWidth = 1; bx.font = "600 9.5px Segoe UI, system-ui, sans-serif";
    M.groups.forEach((g, k) => {
      const a0 = g.start * cell + 1.5, a1 = Math.min(M.axisLen, g.start + g.len) * cell - 1.5;
      bx.beginPath();
      if (!M.vertical) { bx.moveTo(this.GUT - 6, a0); bx.lineTo(this.GUT - 10, a0); bx.lineTo(this.GUT - 10, a1); bx.lineTo(this.GUT - 6, a1); }
      else { bx.moveTo(a0, this.GUT - 6); bx.lineTo(a0, this.GUT - 10); bx.lineTo(a1, this.GUT - 10); bx.lineTo(a1, this.GUT - 6); }
      bx.stroke();
      if ((a1 - a0) > 18) {
        bx.textAlign = "center";
        if (!M.vertical) { bx.save(); bx.translate(this.GUT - 19, (a0 + a1) / 2); bx.rotate(-Math.PI / 2); bx.fillText(`G${k + 1}`, 0, 3); bx.restore(); }
        else bx.fillText(`G${k + 1}`, (a0 + a1) / 2, this.GUT - 15);
      }
    });
    // one lit line sprite (warm white LED + soft bloom)
    const len = this.nOther * cell;
    const [sp, sx] = M.vertical ? this.mk(cell, len) : this.mk(len, cell);
    sx.fillStyle = "rgba(255,236,250,.16)"; sx.fillRect(0, 0, M.vertical ? cell : len, M.vertical ? len : cell);
    const save = this.GUT; this.GUT = 0; this.dots(sx, 1, "#fff7f0", true); this.GUT = save;
    this.sprite = sp;
  }
  draw() {
    const x = this.ctx, M = this.M, cell = this.cell;
    x.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    x.clearRect(0, 0, this.W, this.H);
    x.drawImage(this.base, 0, 0, this.W, this.H);
    const sw = M.vertical ? cell : this.nOther * cell, sh = M.vertical ? this.nOther * cell : cell;
    for (let l = 0; l < M.axisLen; l++) {
      const v = this.inten[l]; if (v < .02) continue;
      x.globalAlpha = Math.min(1, v);
      if (M.vertical) x.drawImage(this.sprite, l * cell, this.GUT, sw, sh); else x.drawImage(this.sprite, this.GUT, l * cell, sw, sh);
    }
    x.globalAlpha = 1;
    if (!this.steady) { // pointer ticks for the current step
      x.fillStyle = "#c86bf5";
      (M.steps[this.k] || []).forEach((l) => {
        x.beginPath();
        if (!M.vertical) { const y = l * cell + cell / 2; x.moveTo(this.GUT - 1, y); x.lineTo(this.GUT - 6, y - 3.5); x.lineTo(this.GUT - 6, y + 3.5); }
        else { const xx = l * cell + cell / 2; x.moveTo(xx, this.GUT - 1); x.lineTo(xx - 3.5, this.GUT - 6); x.lineTo(xx + 3.5, this.GUT - 6); }
        x.fill();
      });
    }
  }
  light(k, clear) { if (clear) this.inten.fill(0); this.k = k; (this.M.steps[k] || []).forEach((l) => { this.inten[l] = 1; }); }
  setSpeed(i) {
    this.idx = i; const v = SPEEDS[i], sp = $("#sc-speed", this.root);
    sp.style.setProperty("--p", `${(i / 13) * 100}%`);
    const M = this.M;
    $("#sc-out", this.root).textContent = v === Infinity ? (M.refresh ? `Real · ${nf(M.refresh * M.scan)}/s` : "Real speed") : `${v} step${v === 1 ? "" : "s"}/s`;
    sp.setAttribute("aria-valuetext", v === Infinity ? "Real speed" : `${v} steps per second`);
    if (v === Infinity) { this.goSteady(); }
    else if (this.steady) { this.steady = false; this.light(this.k, true); this.draw(); if (this.playing) this.loop(); }
    this.updateUI();
  }
  goSteady() {
    this.steady = true; this.stopLoop();
    this.inten.fill(0); this.M.steps.forEach((ls) => ls.forEach((l) => { this.inten[l] = 1; }));
    this.draw(); this.updateUI();
  }
  play() {
    this.playing = true;
    if (SPEEDS[this.idx] === Infinity) { this.goSteady(); } else this.loop();
    this.updateUI();
  }
  pause() { this.playing = false; this.stopLoop(); this.updateUI(); }
  step() {
    if (this.playing) this.pause();
    if (this.steady) { this.steady = false; this.idx = 11; $("#sc-speed", this.root).value = 11; this.setSpeed(11); }
    this.light((this.k + 1) % this.M.scan, true); this.draw(); this.updateUI(true);
  }
  loop() { if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame((t) => this.tick(t)); } }
  stopLoop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; }
  tick(t) {
    this.raf = 0; if (!this.playing || this.steady) return;
    const dt = Math.min(.1, (t - this.last) / 1000); this.last = t;
    const sp = SPEEDS[this.idx], M = this.M;
    const tau = RM.matches ? .001 : sp <= 4 ? .22 : .14;
    const f = Math.exp(-dt / tau); for (let l = 0; l < this.inten.length; l++) this.inten[l] *= f;
    this.acc += dt * sp; let n = Math.floor(this.acc); this.acc -= n;
    if (n >= M.scan) { this.k = (this.k + n) % M.scan; M.steps.forEach((ls) => ls.forEach((l) => { this.inten[l] = Math.max(this.inten[l], .9); })); }
    else while (n-- > 0) this.light((this.k + 1) % M.scan, false);
    this.draw();
    if (t - this.readT > 90) { this.readT = t; this.updateUI(); }
    this.raf = requestAnimationFrame((tt) => this.tick(tt));
  }
  updateUI(announce) {
    const M = this.M, r = $("#scan-read", this.root); if (!r) return;
    const pb = $("#sc-play", this.root);
    pb.innerHTML = this.playing ? `${I.pause}Pause` : `${I.play}Play`;
    pb.setAttribute("aria-pressed", String(this.playing));
    r.setAttribute("aria-live", this.playing ? "off" : "polite");
    if (this.steady) {
      r.innerHTML = `<span>Real speed.</span> Every ${M.word} fires ${M.refresh ? `${nf(M.refresh)} times a second` : "thousands of times a second"}. Too fast to follow, so the module looks evenly lit.`;
      this.orderCells.forEach((c) => c.classList.remove("on"));
      return;
    }
    const ls = M.steps[this.k] || [];
    const list = ls.length > 8 ? ls.slice(0, 8).join(", ") + ", …" : ls.join(", ");
    r.innerHTML = `<span>Step</span> ${this.k + 1} <span>of</span> ${M.scan}<span> · scan line</span> ${esc(M.order[this.k])}<br><span>Lit ${M.word}s:</span> ${esc(list || "none")}${ls.length ? ` <span>(${ls.length})</span>` : ""}`;
    if (this.onCell) this.onCell.classList.remove("on");
    this.onCell = this.orderCells[this.k]; if (this.onCell) this.onCell.classList.add("on");
  }
}

/* ---------------- Picture preview ---------------- */
class PicSim {
  constructor(root, M) {
    this.root = root; this.M = M; this.pattern = "ramp"; this.lift = false; this.img = null;
    const fileFn = curveFn(M.table);
    this.lutA = (lift) => this.lut((x) => fileFn(x), M.bright, M.bits, lift);
    this.lutB = (lift) => this.lut((x) => Math.pow(x, 2.2), 1, 16, lift);
    $$("#pic-seg button", root).forEach((b) => b.addEventListener("click", () => {
      this.pattern = b.dataset.p; $$("#pic-seg button", root).forEach((x) => x.setAttribute("aria-pressed", String(x === b))); this.render();
    }));
    $("#pic-lift", root).addEventListener("change", (e) => { this.lift = e.target.checked; this.render(); });
    $("#pic-file", root).addEventListener("change", (e) => this.loadImage(e.target.files[0]));
    this.render();
  }
  /* input 0–255 → LED linear light (curve × brightness, quantised to gray depth) → display value (encode with 1/2.2) */
  lut(curve, bright, bits, lift) {
    const out = new Uint8ClampedArray(256), levels = Math.pow(2, bits) - 1, k = lift ? 8 : 1;
    for (let v = 0; v < 256; v++) {
      const L = curve(v / 255) * bright;
      const q = Math.round(L * levels) / levels;
      out[v] = Math.round(255 * Math.pow(clamp(q * k, 0, 1), 1 / 2.2));
    }
    return out;
  }
  loadImage(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      this.img = im; URL.revokeObjectURL(url); this.pattern = "image";
      const seg = $("#pic-seg", this.root);
      if (!$('[data-p="image"]', seg)) seg.insertAdjacentHTML("beforeend", `<button type="button" data-p="image" aria-pressed="true">Your image</button>`);
      $$("button", seg).forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.p === "image")));
      $('[data-p="image"]', seg).onclick = () => { this.pattern = "image"; $$("button", seg).forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.p === "image"))); this.render(); };
      this.render(); toast("Image loaded. It stays on this laptop.");
    };
    im.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't read that image."); };
    im.src = url;
  }
  source(cols, rows) {
    const px = new Uint8ClampedArray(cols * rows * 3);
    const set = (x, y, r, g, b) => { const o = (y * cols + x) * 3; px[o] = r; px[o + 1] = g; px[o + 2] = b; };
    const p = this.pattern;
    if (p === "image" && this.img) {
      const c = document.createElement("canvas"); c.width = cols; c.height = rows; const x = c.getContext("2d");
      const im = this.img, s = Math.max(cols / im.width, rows / im.height), w = im.width * s, h = im.height * s;
      x.imageSmoothingQuality = "high"; x.drawImage(im, (cols - w) / 2, (rows - h) / 2, w, h);
      const d = x.getImageData(0, 0, cols, rows).data;
      for (let i = 0; i < cols * rows; i++) { px[i * 3] = d[i * 4]; px[i * 3 + 1] = d[i * 4 + 1]; px[i * 3 + 2] = d[i * 4 + 2]; }
      return px;
    }
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const u = x / (cols - 1), v = y / (rows - 1);
      if (p === "ramp") {
        let g;
        if (v < .44) g = Math.round(u * 255);
        else if (v < .52) g = 0;
        else g = Math.min(255, Math.floor(x / cols * 16) * 17);
        set(x, y, g, g, g);
      } else if (p === "bars") {
        if (v < .64) {
          const b = Math.min(6, Math.floor(u * 7)), C = [[255, 255, 255], [255, 255, 0], [0, 255, 255], [0, 255, 0], [255, 0, 255], [255, 0, 0], [0, 0, 255]][b];
          set(x, y, C[0], C[1], C[2]);
        } else if (v < .72) { set(x, y, 0, 0, 0); }
        else if (u < .6) { const g = Math.round(u / .6 * 255); set(x, y, g, g, g); }
        else { const n = Math.min(3, Math.floor((u - .6) / .4 * 4)), g = [0, 8, 16, 32][n]; set(x, y, g, g, g); }
      } else { // night scene: lots of low values
        const sky = 1 - v;
        let r = 4 + 22 * (1 - sky) ** 1.6, g = 3 + 16 * (1 - sky) ** 1.6, b = 12 + 34 * (1 - sky) ** 1.3;
        const mx = u - .78, my = (v - .24) * rows / cols * 1.0, md = Math.hypot(mx, my * (cols / rows) * (rows / cols));
        const dm = Math.hypot((u - .78) * cols, (v - .24) * rows) / cols;
        if (dm < .055) { r = 236; g = 230; b = 208; } else if (dm < .13) { const k = (1 - (dm - .055) / .075) ** 2; r += 40 * k; g += 38 * k; b += 44 * k; }
        // skyline
        const bx = Math.floor(u * 13), hgt = .52 + .3 * ((Math.sin(bx * 12.9898) * 43758.5453) % 1 + 1) % 1 * .6;
        if (v > hgt) {
          r = 9; g = 8; b = 13;
          const wx = Math.floor(u * cols) % 3, wy = Math.floor(v * rows) % 3, seed = Math.abs(Math.sin((Math.floor(u * cols / 3) * 91.3 + Math.floor(v * rows / 3) * 47.7)) * 1e4) % 1;
          if (wx === 1 && wy === 1 && seed > .55) { const w = 30 + seed * 90; r = w; g = w * .72; b = w * .38; }
        }
        if (v > .94) { r = 6 + 20 * u; g = 5 + 8 * u; b = 10; }
        set(x, y, r | 0, g | 0, b | 0);
      }
    }
    return px;
  }
  render() {
    const a = $("#pic-a", this.root), b = $("#pic-b", this.root); if (!a || !b) return;
    const stage = a.parentElement, cs = getComputedStyle(stage);
    const avail = Math.max(160, stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
    const cols = avail >= 420 ? 96 : 64, rows = Math.round(cols * 9 / 16);
    const cell = Math.max(3, Math.floor(avail / cols * 4) / 4);
    const src = this.source(cols, rows);
    this.paint(a, src, cols, rows, cell, this.lutA(this.lift));
    this.paint(b, src, cols, rows, cell, this.lutB(this.lift));
  }
  paint(cv, src, cols, rows, cell, lut) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = cols * cell, H = rows * cell;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px";
    const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.fillStyle = "#050407"; x.fillRect(0, 0, W, H);
    const r = cell * .43;
    for (let y = 0; y < rows; y++) for (let c = 0; c < cols; c++) {
      const o = (y * cols + c) * 3, R = lut[src[o]], G = lut[src[o + 1]], B = lut[src[o + 2]];
      // unlit LEDs still read as faint dots
      x.fillStyle = (R + G + B) < 9 ? "#121019" : `rgb(${R},${G},${B})`;
      x.beginPath(); x.arc(c * cell + cell / 2, y * cell + cell / 2, r, 0, 6.2832); x.fill();
    }
  }
}

function setCompare(slot, item) {
  S.cmp[slot] = { id: item.id, name: item.name };
  toast(`Set ${item.name} as ${slot.toUpperCase()}`);
  $$("[data-cmp]").forEach((b) => b.classList.toggle("set", !!(S.cmp[b.dataset.cmp] && S.cmp[b.dataset.cmp].id === item.id)));
  if (S.cmp.a && S.cmp.b) location.hash = "compare"; else renderTray();
}
function renderTray() {
  const t = $("#tray"), onCmp = location.hash === "#compare";
  if ((!S.cmp.a && !S.cmp.b) || onCmp) { t.hidden = true; return; }
  t.hidden = false;
  t.innerHTML = ["a", "b"].map((k) => `<span class="slot"><b>${k.toUpperCase()}</b><span>${S.cmp[k] ? esc(S.cmp[k].name) : "pick a file"}</span></span>`).join("")
    + `<a class="btn primary" href="#compare" style="height:32px">Compare</a>`;
}
function viewCompare() {
  const opts = S.cfg.map((o) => `<option value="${esc(o.name)}  [${esc(o.id)}]">`).join("");
  const val = (k) => (S.cmp[k] ? `${esc(S.cmp[k].name)}  [${esc(S.cmp[k].id)}]` : "");
  $("#main").innerHTML = `
    <header class="page-head"><div class="eyebrow"><i></i>Compare</div><h1>Two files, only the differences</h1>
      <p class="lede">Pick two configs of the same brand. Tip: open any file and use Compare as A / B.</p></header>
    <div class="cmp-slots">
      <div class="card cmp-slot"><label for="ca">FILE A</label><input id="ca" list="cl" placeholder="Type to search…" value="${val("a")}"></div>
      <div class="card cmp-slot"><label for="cb">FILE B</label><input id="cb" list="cl" placeholder="Type to search…" value="${val("b")}"></div>
      <datalist id="cl">${opts}</datalist>
    </div>
    <div id="cmp-out"></div>`;
  const idOf = (v) => (v.match(/\[([^\]]+)\]\s*$/) || [])[1];
  const run = () => {
    const a = S.cfg.find((x) => x.id === idOf($("#ca").value)), b = S.cfg.find((x) => x.id === idOf($("#cb").value)), out = $("#cmp-out");
    if (a) S.cmp.a = { id: a.id, name: a.name }; if (b) S.cmp.b = { id: b.id, name: b.name };
    if (!a || !b) { out.innerHTML = `<div class="card empty"><h3>Pick both files</h3><p>Start typing a file name, site or chip in A and B.</p></div>`; return; }
    if (S.live) { runLive(a, b, out); return; }
    const keys = [...new Set([...Object.keys(a.spec || {}), ...Object.keys(b.spec || {})])].filter((k) => k !== "driver_chip_code");
    const sv = (i, k) => { const v = (i.spec || {})[k]; return v && typeof v === "object" ? `P${v.value}` : v; };
    const diff = keys.filter((k) => JSON.stringify(sv(a, k)) !== JSON.stringify(sv(b, k)));
    out.innerHTML = `${a.brand !== b.brand ? `<div class="banner">${I.warn}<span>These are different brands, so most settings won't line up.</span></div>` : ""}
      <div class="results-meta"><span><b style="color:var(--text)">${diff.length}</b> of ${keys.length} summary settings differ${S.live ? "" : " · prototype compares the spec summary; the live build compares every field"}</span></div>
      ${diff.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Setting</th><th>A · ${esc(a.name)}</th><th>B · ${esc(b.name)}</th></tr></thead><tbody>
      ${diff.map((k) => `<tr><td>${esc(LABELS[k] || k)}</td><td class="mono diff-a">${esc(dash(sv(a, k)))}</td><td class="mono diff-b">${esc(dash(sv(b, k)))}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty"><h3>No differences in the summary</h3><p>These two files share every summarised setting.</p></div>`}`;
  };
  $("#ca").addEventListener("change", run); $("#cb").addEventListener("change", run);

async function runLive(a, b, out) {
  out.innerHTML = `<div class="note">${I.info}<span>Comparing every setting…</span></div>`;

      ${r.diff.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Setting</th><th>A · ${esc(a.name)}</th><th>B · ${esc(b.name)}</th></tr></thead><tbody>
      ${r.diff.map((d) => `<tr><td class="mono">${esc(d.field)}</td><td class="mono diff-a">${esc(dash(d.a))}</td><td class="mono diff-b">${esc(dash(d.b))}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty"><h3>Identical</h3><p>Every setting in these two files matches.</p></div>`}`;
  } catch (e) {
    out.innerHTML = `<div class="banner">${I.warn}<span>${esc(e.message)}</span></div>`;
  }
}

      return `<details class="site"><summary>
          <span class="st">${pill(lv)}</span>
          <span class="nm">${esc(r.site)}<small>${esc(r.brands.join(" + ") || "—")} · ${esc(r.configs)} config${r.configs === 1 ? "" : "s"} · ${esc(r.firmware)} firmware</small></span>
          <span class="hide-sm hide-md"><span class="cell-l">Driver chips</span><span class="chips">${r.chips.length ? r.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("") : "—"}</span></span>
          <span class="hide-sm"><span class="cell-l">Cards</span><span class="chips">${r.cards.length ? r.cards.map((c) => `<span class="chip">${esc(c)}</span>`).join("") : '<span style="color:var(--text-3)">—</span>'}</span></span>
          ${I.chev}</summary>
        <div class="site-body">
          <div class="facts"><span>Firmware on file: <b>${esc(r.fw_versions.filter(Boolean).join("; ") || "—")}</b></span><span>Chips: <b>${esc(r.chips.join(", ") || "—")}</b></span></div>
          ${r.flags.length ? `<ul class="flags">${r.flags.map((f) => `<li>${pill(f.level)}<span>${esc(f.text)}<small>${esc(f.file)}</small></span></li>`).join("")}</ul>` : `<p class="allgood">${I.ok}Nothing flagged at this site.</p>`}
          ${files ? `<div><div class="label" style="margin-bottom:6px">Files</div><div class="files">${files}</div></div>` : ""}
        </div></details>`;
    }).join("")}</div>`;
    $$("#site-out a[data-fw]").forEach((a) => a.addEventListener("click", () => { S.fwq = a.dataset.fw; }));
  };
  $("#sq").addEventListener("input", (e) => { S.st.q = e.target.value; render(); });
  $("#sflag").addEventListener("change", (e) => { S.st.flag = e.target.checked; render(); });
  render();
}

/* =====================================================================
   Firmware
   ===================================================================== */
function viewFirmware() {
  $("#main").innerHTML = `
    <header class="page-head"><div class="eyebrow"><i></i>Firmware</div><h1>Firmware we hold</h1>
      <p class="lede">What card and chips each package is built for, and which tool flashes it.</p></header>
    <div class="banner" style="background:var(--info-soft)">${I.info}<span>Flash only with the official tools: <b>NovaLCT</b> for NovaStar, <b>LEDUpgrade</b> or the factory for Colorlight. This tool never changes firmware.</span></div>
    <div class="toolbar" role="search"><label class="search">${I.search}<span class="sr">Search firmware</span><input id="fq" type="search" autocomplete="off" placeholder="Find by card or driver chip… e.g. E320  3364  RV-S" value="${esc(S.fwq)}"><kbd>/</kbd></label></div>
    <div id="fw-out"></div>`;
  const render = () => {
    const q = S.fwq.trim().toLowerCase();
    const rows = S.fw.filter((f) => !q || matchQ(hay([f.name, f.card, f.version, f.chips, f.sites, f.brand]), q))
      .sort((a, b) => (a.brand + a.card + a.version).localeCompare(b.brand + b.card + b.version));
    const out = $("#fw-out");
    if (!rows.length) { out.innerHTML = emptyState("firmware", S.fwq.trim()); $("#clear").addEventListener("click", () => { S.fwq = ""; route(); }); return; }
    out.innerHTML = `<div class="results-meta"><span>${nf(rows.length)} package${rows.length === 1 ? "" : "s"}</span></div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Card</th><th>Brand</th><th>Version</th><th>Built for chips</th><th>Flash with</th><th class="hide-lg">Sites</th></tr></thead><tbody>
      ${rows.map((f) => `<tr class="row" style="cursor:default"><td class="name"><span style="font-weight:600">${esc(dash(f.card))}</span>
          <span class="sub">${esc([f.brand, f.version, (f.chips || []).join(", ")].filter(Boolean).join(" · "))}</span><span class="sub s2">${esc((f.sites || []).join(", "))}</span></td>
        <td>${brandChip(f.brand)}</td><td class="mono">${esc(dash(f.version))}</td><td>${(f.chips || []).length ? f.chips.map((c) => `<span class="chip" style="margin:2px 4px 2px 0">${esc(c)}</span>`).join("") : "—"}</td>
        <td>${esc(dash(f.flash_with))}${f.encrypted ? ' <span class="pill neutral">Encrypted</span>' : ""}</td><td class="sites hide-lg">${esc((f.sites || []).join(", "))}</td></tr>`).join("")}
      </tbody></table></div>`;
  };
  $("#fq").addEventListener("input", (e) => { S.fwq = e.target.value; render(); });
  render();
}

/* =====================================================================
   Inspect
   ===================================================================== */
function viewInspect() {
  $("#main").innerHTML = `
    <header class="page-head"><div class="eyebrow"><i></i>Inspect</div><h1>Read any NovaStar LED config in your browser</h1>
      <p class="lede">Drop a NovaStar .rcfgx file. You get a full spec card, plain-words checks, and a Light-up Preview of how the module scans and looks — all read in your browser. Nothing is uploaded, nothing is sent to a screen.</p></header>
    <label class="drop" id="drop"><input type="file" id="ifile" class="sr" accept=".rcfgx,.rcvbp,.rcgfx,.zip">
      <svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px;color:var(--brand-ink)"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
      <b>Drop a config file here</b><span>or click to choose · NovaStar .rcfgx</span></label>
    <div class="checks-list" aria-label="What gets checked">${["Damaged file", "Checksum", "Gamma curve", "Brightness", "Gray depth", "Refresh", "Calibration", "Older chips"].map((c) => `<span class="chip">${c}</span>`).join("")}</div>
    <div id="insp-out" style="margin-top:18px"></div>`;
  const drop = $("#drop"), inp = $("#ifile");
  const took = async (f) => {
    const out = $("#insp-out");
    if (/\.rcvbp$/i.test(f.name)) {
      out.innerHTML = `<div class="note">${I.info}<span>This page reads NovaStar <b>.rcfgx</b> files. Colorlight <b>.rcvbp</b> files need the desktop Control Room.</span></div>`;
      return;
    }
    out.innerHTML = `<div class="note">${I.info}<span>Reading <b style="color:var(--text)">${esc(f.name)}</b> (${nf(Math.round(f.size / 1024))} KB) in your browser — nothing is uploaded.</span></div>`;
    try {
      const j = await VRO.inspectNova(f, window.VR_CHIPS || {});
      if (location.hash !== "#inspect") return;
      const item = { id: j.id, kind: "config", name: f.name, brand: j.brand, spec: j.spec || {}, findings: j.findings || [],
                     level: j.level || "ok", sites: [], inspected: true };
      S.cfg = S.cfg.filter((x) => x.id !== item.id).concat([item]);
      if (j.layout && j.layout.module_cols) S.layouts[`id:${item.id}`] = j.layout;
      location.hash = `item=${encodeURIComponent(item.id)}`;
    } catch (e) {
      out.innerHTML = `<div class="banner">${I.warn}<span>Couldn't read this file: ${esc(e.message)}</span></div>`;
    }
  };
  ["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (ev) => { const f = ev.dataTransfer.files[0]; if (f) took(f); });
  inp.addEventListener("change", () => { if (inp.files[0]) took(inp.files[0]); inp.value = ""; });
}

/* ===================================================================== */
let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

if (params.has("loading")) { $("#main").innerHTML = loadingView(); } else { route(); boot(); }
</script>
</body>
</html>
